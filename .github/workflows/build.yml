name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Create API Plist File
        run: |
          mkdir -p GeminiChatBot
          cat << 'EOF' > GeminiChatBot/google-api-info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>API_KEY</key>
              <string>AIzaSyYourActualApiKeyHere</string>
          </dict>
          </plist>
          EOF

      - name: Build App
        run: |
          # 1. Tự động tìm file .xcodeproj bất kể tên gì
          PROJECT_FILE=$(find . -name "*.xcodeproj" -maxdepth 2 | head -n 1)
          echo "Found project: $PROJECT_FILE"
          
          # 2. Tự động liệt kê và lấy tên Scheme đầu tiên
          SCHEME_NAME=$(xcodebuild -project "$PROJECT_FILE" -list | grep -A 10 "Schemes:" | tail -n +2 | head -n 1 | xargs)
          echo "Detected Scheme: $SCHEME_NAME"

          # 3. Tiến hành Build app cho iOS (Arm64)
          xcodebuild clean build \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME_NAME" \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            BUILD_DIR=build

      - name: Package to IPA
        run: |
          # 4. Tự động đóng gói file .app bất kể tên gì thành tệp .ipa
          mkdir -p Payload
          find build/Release-iphoneos -name "*.app" -maxdepth 1 -exec cp -r {} Payload/ \;
          zip -r Gemini-App-Unsigned.ipa Payload
          echo "IPA packaged successfully!"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gemini-IPA-File
          path: Gemini-App-Unsigned.ipa

name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Create API Plist File
        run: |
          mkdir -p GeminiChatBot
          cat << 'EOF' > GeminiChatBot/google-api-info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>API_KEY</key>
              <string>AQ.Ab8RN6JxIZQagG5pcRtNqSShRhZRNuiraSVY6Cya8t1RUzRDiA</string>
          </dict>
          </plist>
          EOF

      - name: Install Pods
        run: |
          if [ -f "Podfile" ]; then
            pod install
          fi

      - name: Build App
        run: |
          # Kiểm tra xem có file .xcworkspace (CocoaPods) hay không để ưu tiên sử dụng
          if find . -name "*.xcworkspace" -maxdepth 2 | grep -q .; then
            WORKSPACE_FILE=$(find . -name "*.xcworkspace" -maxdepth 2 | head -n 1)
            echo "Found workspace: $WORKSPACE_FILE"
            
            SCHEME_NAME=$(xcodebuild -workspace "$WORKSPACE_FILE" -list | grep -A 10 "Schemes:" | tail -n +2 | head -n 1 | xargs)
            echo "Detected Scheme: $SCHEME_NAME"

            xcodebuild clean build \
              -workspace "$WORKSPACE_FILE" \
              -scheme "$SCHEME_NAME" \
              -sdk iphoneos \
              -configuration Release \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              BUILD_DIR=build
          else
            PROJECT_FILE=$(find . -name "*.xcodeproj" -maxdepth 2 | head -n 1)
            echo "Found project: $PROJECT_FILE"
            
            SCHEME_NAME=$(xcodebuild -project "$PROJECT_FILE" -list | grep -A 10 "Schemes:" | tail -n +2 | head -n 1 | xargs)
            echo "Detected Scheme: $SCHEME_NAME"

            xcodebuild clean build \
              -project "$PROJECT_FILE" \
              -scheme "$SCHEME_NAME" \
              -sdk iphoneos \
              -configuration Release \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              BUILD_DIR=build
          fi

      - name: Package to IPA
        run: |
          mkdir -p Payload
          find build/Release-iphoneos -name "*.app" -maxdepth 1 -exec cp -r {} Payload/ \;
          zip -r Gemini-App-Unsigned.ipa Payload
          echo "IPA packaged successfully!"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gemini-IPA-File
          path: Gemini-App-Unsigned.ipa

- name: Build App
        run: |
          # Tìm file .xcodeproj
          PROJECT_FILE=$(find . -name "*.xcodeproj" -maxdepth 2 | head -n 1)
          echo "Found project: $PROJECT_FILE"
          
          # Tự động lấy tên scheme hợp lệ đầu tiên trong project
          SCHEME_NAME=$(xcodebuild -project "$PROJECT_FILE" -list -json | tr -d '\n' | grep -o '"schemes":\[[^]]*\]' | grep -o '"[^"]*"' | head -n 1 | tr -d '"')
          echo "Detected Scheme name: $SCHEME_NAME"

          xcodebuild clean build \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME_NAME" \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            BUILD_DIR=build

      - name: Package to IPA
        run: |
          # Tìm app được build ra (bất kể tên gì)
          mkdir -p Payload
          find build/Release-iphoneos -name "*.app" -maxdepth 1 -exec cp -r {} Payload/ \;
          zip -r Simple-Gemini-Unsigned.ipa Payload

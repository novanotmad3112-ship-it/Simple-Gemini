name: Build Unsigned IPA

on:
  workflow_dispatch:

env:
  WORKSPACE: GeminiChatBot.xcworkspace
  SCHEME: GeminiChatBot

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          pod --version

      - name: Create API Plist File
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::GEMINI_API_KEY secret is not set. The app will build but the API key will be empty."
          fi
          cat > GeminiChatBot/google-api-info.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>API_KEY</key>
              <string>${GEMINI_API_KEY}</string>
          </dict>
          </plist>
          EOF
          # Sanity check: the plist must be referenced by the Xcode project to land in the app bundle
          if ! grep -q "google-api-info.plist" GeminiChatBot.xcodeproj/project.pbxproj; then
            echo "::warning::google-api-info.plist is not referenced in project.pbxproj, so it won't be bundled into the app."
          fi

      - name: Install Pods
        run: pod install

      - name: Build App
        run: |
          set -o pipefail
          xcodebuild clean build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO

      - name: Package to IPA
        run: |
          PRODUCTS_DIR="build/Build/Products/Release-iphoneos"
          echo "Build products:"
          ls -la "$PRODUCTS_DIR"

          APP_PATH=$(find "$PRODUCTS_DIR" -maxdepth 1 -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app found in $PRODUCTS_DIR"
            exit 1
          fi
          echo "Using compiled app at: $APP_PATH"

          rm -rf Payload Gemini-App-Unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Gemini-App-Unsigned.ipa Payload
          echo "IPA packaged successfully!"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gemini-IPA-File
          path: Gemini-App-Unsigned.ipa
